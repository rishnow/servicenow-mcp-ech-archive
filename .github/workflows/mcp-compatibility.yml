name: MCP compatibility

on:
  workflow_dispatch:
  push:
    branches:
      - rish-pdi
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - "src/**"
      - ".github/workflows/mcp-compatibility.yml"

jobs:
  compatibility:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve dependencies
        run: uv lock -v

      - name: Install dependencies
        run: uv sync --locked

      - name: Show MCP version
        run: uv run python -c "import importlib.metadata; print('MCP version:', importlib.metadata.version('mcp'))"

      - name: Import ServiceNow MCP server
        run: uv run python -c "from servicenow_mcp.server import ServiceNowMCP; print('ServiceNowMCP import OK')"

      - name: Test full MCP tool package
        run: uv run --with pytest pytest -q tests/test_mcp_compatibility.py
